[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-search"
version = "0.1.0"
description = "Render and full-text search your Claude Code session transcripts — locally, with one command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "transcripts", "search", "fts5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
]

[project.scripts]
chat-search = "chat_search.cli:main"

[project.urls]
Homepage = "https://github.com/bitgeek-in/chat-search"
Hosted = "https://chat-search.bitgeek.in"

[tool.hatch.build.targets.wheel]
packages = ["chat_search"]
